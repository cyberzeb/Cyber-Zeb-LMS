# Mailpit — a local mail server that captures every message instead of
# delivering it, so sign-in codes can be tested without owning a domain.
#
#   docker compose -f docker-compose.mailpit.yml up -d
#   open http://localhost:8025          # inbox
#   docker compose -f docker-compose.mailpit.yml down
#
# Point the API at it with SMTP_HOST=localhost and SMTP_PORT=1025
# (already the defaults in backend/.env.example).

services:
  mailpit:
    image: axllent/mailpit:latest
    container_name: brana_mailpit
    restart: unless-stopped
    ports:
      - "1025:1025"  # SMTP — the API sends here
      - "8025:8025"  # Web UI — read the captured mail here
    environment:
      MP_MAX_MESSAGES: 5000
      # Accept any credentials and plain connections: this is a test server and
      # must never be exposed outside the development machine.
      MP_SMTP_AUTH_ACCEPT_ANY: 1
      MP_SMTP_AUTH_ALLOW_INSECURE: 1
