version: "3.9"

services:
  db:
    image: postgres:16-alpine
    container_name: brana_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: brana_user
      POSTGRES_PASSWORD: brana_pass
      POSTGRES_DB: brana_lms
    ports:
      - "5432:5432"
    volumes:
      - brana_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U brana_user -d brana_lms"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: brana_redis
    restart: unless-stopped
    ports:
      - "6379:6379"

  api:
    build: .
    container_name: brana_api
    restart: unless-stopped
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    ports:
      - "8000:8000"
    volumes:
      - ./app:/code/app
      - ./alembic:/code/alembic
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  worker:
    build: .
    container_name: brana_worker
    restart: unless-stopped
    env_file: .env
    depends_on:
      - db
      - redis
    volumes:
      - ./app:/code/app
    command: celery -A app.core.celery_app worker --loglevel=info

  adminer:
    image: adminer
    container_name: brana_adminer
    restart: unless-stopped
    ports:
      - "8080:8080"

volumes:
  brana_pg_data:
