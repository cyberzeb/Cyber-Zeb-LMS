# Postgres + Redis stack for local/full production (optional).
# Usage: docker compose -f docker-compose.postgres.yml up --build -d

services:
  db:
    image: postgres:16-alpine
    container_name: brana_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-brana_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-brana_pass}
      POSTGRES_DB: ${POSTGRES_DB:-brana_lms}
    volumes:
      - brana_pg_data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-brana_user} -d ${POSTGRES_DB:-brana_lms}",
        ]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: brana_redis
    restart: unless-stopped

  api:
    build: ./backend
    container_name: brana_api
    restart: unless-stopped
    env_file: .env
    environment:
      APP_ENV: production
      DEBUG: "false"
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-brana_user}:${POSTGRES_PASSWORD:-brana_pass}@db:5432/${POSTGRES_DB:-brana_lms}
      DATABASE_URL_SYNC: postgresql+psycopg://${POSTGRES_USER:-brana_user}:${POSTGRES_PASSWORD:-brana_pass}@db:5432/${POSTGRES_DB:-brana_lms}
      REDIS_URL: redis://redis:6379/0
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started

  worker:
    build: ./backend
    container_name: brana_worker
    restart: unless-stopped
    env_file: .env
    environment:
      APP_ENV: production
      DEBUG: "false"
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-brana_user}:${POSTGRES_PASSWORD:-brana_pass}@db:5432/${POSTGRES_DB:-brana_lms}
      DATABASE_URL_SYNC: postgresql+psycopg://${POSTGRES_USER:-brana_user}:${POSTGRES_PASSWORD:-brana_pass}@db:5432/${POSTGRES_DB:-brana_lms}
      REDIS_URL: redis://redis:6379/0
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    command: celery -A app.core.celery_app worker --loglevel=info

  web:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: /api/v1
    container_name: brana_web
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-8085}:80"
    depends_on:
      - api

volumes:
  brana_pg_data:
