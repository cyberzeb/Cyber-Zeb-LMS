<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>brana-lms</title>
  </head>
  <body>
    <div id="root"></div>
    <script>
      (function () {
        try {
          var t = localStorage.getItem('berana:theme') || localStorage.getItem('berana:student-theme');
          if (t && JSON.parse(t) === 'dark') {
            document.documentElement.classList.add('portal-dark');
            document.body.classList.add('sdm-portal-dark');
          }
        } catch (e) {}
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
