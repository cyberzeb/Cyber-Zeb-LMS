# SQLite production stack. Host 80/443 are left free for other sites.
# Publish HTTP 7777 and HTTPS 8443 only. On the VPS: ./deploy/vps-docker.sh

services:
  api:
    build: ./backend
    container_name: brana_api
    restart: unless-stopped
    env_file: .env
    environment:
      APP_ENV: production
      DEBUG: "false"
      DATABASE_URL: sqlite+aiosqlite:////code/data/brana_lms.db
      DATABASE_URL_SYNC: sqlite:////code/data/brana_lms.db
      # Keep backups on the persistent volume (not /tmp inside the container).
      BACKUP_DIR: /code/data/backups
      FRONTEND_BASE_URL: ${PUBLIC_URL:-}
      ZOOM_ACCOUNT_ID: ${ZOOM_ACCOUNT_ID:-}
      ZOOM_CLIENT_ID: ${ZOOM_CLIENT_ID:-}
      ZOOM_CLIENT_SECRET: ${ZOOM_CLIENT_SECRET:-}
      ZOOM_USER_EMAIL: ${ZOOM_USER_EMAIL:-}
    volumes:
      - brana_sqlite_data:/code/data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8000/health"]
      interval: 5s
      timeout: 5s
      retries: 24
      start_period: 40s

  web:
    build:
      context: .
      dockerfile: ${WEB_DOCKERFILE:-Dockerfile}
      args:
        VITE_API_BASE_URL: /api/v1
    container_name: brana_web
    restart: unless-stopped
    ports:
      - "7777:80"
      - "8443:443"
    volumes:
      - ./deploy/certs:/etc/nginx/certs:ro
    depends_on:
      - api

  # Optional local/staging mail catcher, started only on request:
  #   docker compose --profile mail up -d mailpit
  # Then set SMTP_HOST=mailpit and SMTP_PORT=1025 in .env and recreate the api.
  # Never expose 8025 publicly — it shows every captured message.
  mailpit:
    image: axllent/mailpit:latest
    container_name: brana_mailpit
    restart: unless-stopped
    profiles: ["mail"]
    ports:
      - "127.0.0.1:1025:1025"
      - "127.0.0.1:8025:8025"
    environment:
      MP_MAX_MESSAGES: 5000
      MP_SMTP_AUTH_ACCEPT_ANY: 1
      MP_SMTP_AUTH_ALLOW_INSECURE: 1

volumes:
  brana_sqlite_data:
