# Production stack (SQLite) — on the VPS: ./deploy/vps-docker.sh
# Shared VPS: HTTP_PORT (default 7777) and HTTPS_PORT (default 8443).

services:
  api:
    build: ./backend
    container_name: brana_api
    restart: unless-stopped
    env_file: .env
    environment:
      APP_ENV: production
      DEBUG: "false"
      DATABASE_URL: sqlite+aiosqlite:////code/data/brana_lms.db
      DATABASE_URL_SYNC: sqlite:////code/data/brana_lms.db
    volumes:
      - brana_sqlite_data:/code/data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8000/health"]
      interval: 5s
      timeout: 5s
      retries: 24
      start_period: 20s

  web:
    build:
      context: .
      dockerfile: ${WEB_DOCKERFILE:-Dockerfile}
      args:
        VITE_API_BASE_URL: /api/v1
    container_name: brana_web
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-7777}:80"
      - "${HTTPS_PORT:-8443}:443"
    volumes:
      - ./deploy/certs:/etc/nginx/certs:ro
    depends_on:
      api:
        condition: service_healthy

volumes:
  brana_sqlite_data:
