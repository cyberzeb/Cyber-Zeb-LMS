# Production stack (SQLite) — build on the VPS: docker compose up --build -d
# Shared VPS: set HTTP_PORT in .env (e.g. 8085). See DEPLOY.md

services:
  api:
    build: ./backend
    container_name: brana_api
    restart: unless-stopped
    env_file: .env
    environment:
      APP_ENV: production
      DEBUG: "false"
      DATABASE_URL: sqlite+aiosqlite:////code/data/brana_lms.db
      DATABASE_URL_SYNC: sqlite:////code/data/brana_lms.db
    volumes:
      - brana_sqlite_data:/code/data

  web:
    build:
      context: .
      dockerfile: ${WEB_DOCKERFILE:-Dockerfile}
      args:
        VITE_API_BASE_URL: /api/v1
    container_name: brana_web
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-8085}:80"
      - "${HTTPS_PORT:-8443}:443"
    volumes:
      - ./deploy/certs:/etc/nginx/certs:ro
    depends_on:
      - api

volumes:
  brana_sqlite_data:
